name: home-presence-netalertx

services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:26.10.28
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    volumes:
      - home_presence_netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:mode=1700,uid=0,gid=0,rw,noexec,nosuid,nodev,async,noatime,nodiratime
    environment:
      LISTEN_ADDR: ${NETALERTX_LISTEN_ADDR:-127.0.0.1}
      PORT: ${NETALERTX_WEB_PORT:-20211}
      GRAPHQL_PORT: ${NETALERTX_API_PORT:-20212}
      APP_CONF_OVERRIDE: >-
        {"GRAPHQL_PORT":"${NETALERTX_API_PORT:-20212}","TIMEZONE":"Europe/Kyiv"}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  home_presence_netalertx:
    name: home_presence_netalertx

name: home-presence

services:
  bot:
    image: ${BOT_IMAGE:-home-presence-bot:1}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - home_presence_db:/data
    networks:
      - bot_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      NETALERTX_URL: ${NETALERTX_URL:-http://host.docker.internal:20212}
      REFERENCE_MAC: ${REFERENCE_MAC:?Set REFERENCE_MAC}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:?Set ADMIN_USER_IDS}
      MEMBER_USER_IDS: ${MEMBER_USER_IDS:-}
      ALLOWED_GROUP_IDS: ${ALLOWED_GROUP_IDS:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      DISCOVERY_CHAT_ID: ${DISCOVERY_CHAT_ID:-}
      GUEST_CHAT_ID: ${GUEST_CHAT_ID:-}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      SCAN_SECONDS: ${SCAN_SECONDS:-60}
      MAX_SCAN_GAP_SECONDS: ${MAX_SCAN_GAP_SECONDS:-}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-10}
      POSITIVE_SCANS: ${POSITIVE_SCANS:-2}
      OFFLINE_SECONDS: ${OFFLINE_SECONDS:-300}
      REMINDER_ABSENCE_SECONDS: ${REMINDER_ABSENCE_SECONDS:-600}
      REMINDER_QUIET_SECONDS: ${REMINDER_QUIET_SECONDS:-1200}
      ANNOUNCE_INITIAL_DEVICES: ${ANNOUNCE_INITIAL_DEVICES:-false}
      DATABASE_PATH: /data/presence.sqlite3
      TZ: Europe/Kyiv
    healthcheck:
      test: ["CMD", "python", "-m", "main", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  home_presence_db:
    name: home_presence_db

networks:
  bot_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-homepresence
